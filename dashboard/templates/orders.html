{% extends "base.html" %}
{% block page_title %}Orders{% endblock %}
{% block content %}
<div class="section">
<div class="section-header"><h2>Orders</h2></div>
<div class="table-container">
<table>
<thead>
<tr>
{% for key in orders[0].keys() if orders %}
<th>{{ key }}</th>
{% endfor %}
</tr>
</thead>
<tbody>
{% for order in orders %}
<tr>
{% for value in order.values() %}
<td>{{ value }}</td>
{% endfor %}
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
{% endblock %}

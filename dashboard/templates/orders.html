{% extends "base.html" %}
{% block page_title %}Orders{% endblock %}
{% block content %}
<div class="section">
<div class="section-header">

    <h2>Orders</h2>

    <form method="get"
          action="{{ url_for('orders') }}"
          class="search-form">

        <input
            type="text"
            name="search"
            placeholder="Search orders..."
            value="{{ search }}"
        >

        <button type="submit">Search</button>

    </form>

</div>
<div class="table-container">
<table>
<thead>
<tr>
{% for key in orders[0].keys() if orders %}
<th>{{ key }}</th>
{% endfor %}
</tr>
</thead>
<tbody>
{% for order in orders %}
<tr>
{% for value in order.values() %}
<td>{{ value }}</td>
{% endfor %}
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
{% endblock %}

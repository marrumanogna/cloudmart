<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}CloudMart{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app-shell">

    <header class="topnav">

        <a href="{{ url_for('dashboard') }}" class="brand">
            <span class="brand-mark">C</span>
            <span class="brand-copy">
                <strong>CloudMart</strong>
                <small>Admin Console</small>
            </span>
        </a>

        <nav class="topnav-links" aria-label="Primary navigation">

            <a href="{{ url_for('dashboard') }}"
               class="topnav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                <span>⌂</span>
                Dashboard
            </a>

            <a href="{{ url_for('products') }}"
               class="topnav-item {% if request.endpoint == 'products' %}active{% endif %}">
                <span>◇</span>
                Products
            </a>

            <a href="{{ url_for('customers') }}"
               class="topnav-item {% if request.endpoint == 'customers' %}active{% endif %}">
                <span>◎</span>
                Customers
            </a>

            <a href="{{ url_for('orders') }}"
               class="topnav-item {% if request.endpoint in ['orders', 'order_details'] %}active{% endif %}">
                <span>▣</span>
                Orders
            </a>

            <a href="{{ url_for('order_items') }}"
               class="topnav-item {% if request.endpoint == 'order_items' %}active{% endif %}">
                <span>≡</span>
                Order Items
            </a>

            <a href="{{ url_for('history') }}"
               class="topnav-item {% if request.endpoint == 'history' %}active{% endif %}">
                <span>◷</span>
                History
            </a>

            <a href="{{ url_for('reports') }}"
               class="topnav-item {% if request.endpoint in ['reports', 'view_report'] %}active{% endif %}">
                <span>▤</span>
                Reports
            </a>

        </nav>

        <div class="topnav-actions">
            <div class="environment" aria-label="Environment">
                <span class="status-dot"></span>
                {{ environment }}
            </div>

            <a href="{{ url_for('logout') }}" class="logout-link">
                <span>↪</span>
                Logout
            </a>
        </div>

    </header>

    <main class="main">

        <section class="page-heading">
            <div>
                <h1>{% block page_title %}Dashboard{% endblock %}</h1>
                <p class="subtitle">CloudMart Operations Console</p>
            </div>
        </section>

        <section class="content">

            {% block content %}
            {% endblock %}

        </section>

    </main>

</div>

{% block scripts %}{% endblock %}

</body>
</html>

name: CloudMart Infrastructure Deployment

on:
  push:
    branches:
      - main
      - milestone-4
    paths:
      - 'cloudformation/**'
      - 'dashboard/**'
      - 'report-lambda-package/**'
      - 'authorizer-code/**'
      - 'product-lambda/**'
      - 'customer-lambda/**'
      - 'order-lambda/**'
      - 'order-processor-lambda/**'
      - 'database-init-lambda/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  # ============================================================
  # BOOTSTRAP GITHUB ACTIONS IAM
  # ============================================================

  bootstrap-iam:
    name: Bootstrap GitHub Actions IAM
    runs-on: ubuntu-latest
    outputs:
      role_arn: ${{ steps.cloudmart-role.outputs.role_arn }}

    steps:
      - name: Configure Bootstrap AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Grant Bootstrap OIDC Permissions
        shell: bash
        run: |
          cat > oidc-bootstrap-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "iam:CreateOpenIDConnectProvider",
                  "iam:GetOpenIDConnectProvider"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF

          aws iam put-role-policy \
            --role-name CloudMart-GitHubActions-Role \
            --policy-name CloudMartOIDCBootstrap \
            --policy-document file://oidc-bootstrap-policy.json

      - name: Get AWS Account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Create GitHub OIDC Provider
        shell: bash
        run: |
          OIDC_ARN="arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com"

          if aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn "$OIDC_ARN" >/dev/null 2>&1
          then
            echo "GitHub OIDC provider already exists."
          else
            aws iam create-open-id-connect-provider \
              --url https://token.actions.githubusercontent.com \
              --client-id-list sts.amazonaws.com

            echo "GitHub OIDC provider created."
          fi

      - name: Create GitHub Actions Trust Policy
        shell: bash
        run: |
          cat > trust-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "arn:aws:iam::ACCOUNT_ID_PLACEHOLDER:oidc-provider/token.actions.githubusercontent.com"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                  },
                  "StringLike": {
                    "token.actions.githubusercontent.com:sub": [
                      "repo:marrumanogna@223441351/cloudmart@1341672607:ref:refs/heads/*"
                    ]
                  }
                }
              }
            ]
          }
          EOF

          sed -i "s/ACCOUNT_ID_PLACEHOLDER/${ACCOUNT_ID}/g" trust-policy.json

      - name: Create or Update GitHub Actions Role
        shell: bash
        run: |
          ROLE_NAME="CloudMart-GitHubActions-Role"

          if aws iam get-role \
            --role-name "$ROLE_NAME" >/dev/null 2>&1
          then
            echo "Role already exists. Updating trust policy."

            aws iam update-assume-role-policy \
              --role-name "$ROLE_NAME" \
              --policy-document file://trust-policy.json
          else
            echo "Creating GitHub Actions role."

            aws iam create-role \
              --role-name "$ROLE_NAME" \
              --description "GitHub Actions deployment role for CloudMart" \
              --assume-role-policy-document file://trust-policy.json
          fi
      - name: Set CloudMart Role ARN
        id: cloudmart-role
        run: |
          ROLE_ARN=$(aws iam get-role \
            --role-name CloudMart-GitHubActions-Role \
            --query "Role.Arn" \
            --output text)

          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"

      - name: Create Deployment Policy
        shell: bash
        run: |
          cat > deployment-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [

              {
                "Effect": "Allow",
                "Action": [
                  "cloudformation:CreateStack",
                  "cloudformation:UpdateStack",
                  "cloudformation:DeleteStack",
                  "cloudformation:DescribeStacks",
                  "cloudformation:DescribeStackEvents",
                  "cloudformation:DescribeStackResources",
                  "cloudformation:DescribeStackResource",
                  "cloudformation:GetTemplate",
                  "cloudformation:GetTemplateSummary",
                  "cloudformation:ValidateTemplate",
                  "cloudformation:ListStackResources",
                  "cloudformation:CreateChangeSet",
                  "cloudformation:ExecuteChangeSet",
                  "cloudformation:DeleteChangeSet",
                  "cloudformation:DescribeChangeSet",
                  "cloudformation:ListChangeSets"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "iam:CreateRole",
                  "iam:DeleteRole",
                  "iam:GetRole",
                  "iam:UpdateRole",
                  "iam:UpdateAssumeRolePolicy",
                  "iam:PutRolePolicy",
                  "iam:DeleteRolePolicy",
                  "iam:GetRolePolicy",
                  "iam:AttachRolePolicy",
                  "iam:DetachRolePolicy",
                  "iam:TagRole",
                  "iam:UntagRole",
                  "iam:CreateInstanceProfile",
                  "iam:DeleteInstanceProfile",
                  "iam:GetInstanceProfile",
                  "iam:AddRoleToInstanceProfile",
                  "iam:RemoveRoleFromInstanceProfile"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": "iam:PassRole",
                "Resource": [
                  "arn:aws:iam::${ACCOUNT_ID}:role/cloudmart-customer-lambda-role-${ENVIRONMENT}",
                  "arn:aws:iam::${ACCOUNT_ID}:role/cloudmart-product-lambda-role-${ENVIRONMENT}",
                  "arn:aws:iam::${ACCOUNT_ID}:role/cloudmart-order-lambda-role-${ENVIRONMENT}",
                  "arn:aws:iam::${ACCOUNT_ID}:role/cloudmart-order-processor-role-${ENVIRONMENT}",
                  "arn:aws:iam::${ACCOUNT_ID}:role/cloudmart-report-lambda-role-${ENVIRONMENT}",
                  "arn:aws:iam::${ACCOUNT_ID}:role/cloudmart-authorizer-role-${ENVIRONMENT}",
                  "arn:aws:iam::${ACCOUNT_ID}:role/CloudMart-DatabaseInitLambda-${ENVIRONMENT}"
                ]
              },

              {
                "Effect": "Allow",
                "Action": [
                  "lambda:CreateFunction",
                  "lambda:UpdateFunctionCode",
                  "lambda:UpdateFunctionConfiguration",
                  "lambda:DeleteFunction",
                  "lambda:GetFunction",
                  "lambda:GetFunctionConfiguration",
                  "lambda:AddPermission",
                  "lambda:RemovePermission",
                  "lambda:GetPolicy",
                  "lambda:ListVersionsByFunction",
                  "lambda:PublishVersion",
                  "lambda:CreateAlias",
                  "lambda:UpdateAlias",
                  "lambda:DeleteAlias",
                  "lambda:TagResource",
                  "lambda:InvokeFunction"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "apigateway:GET",
                  "apigateway:POST",
                  "apigateway:PUT",
                  "apigateway:PATCH",
                  "apigateway:DELETE"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "events:DescribeEventBus",
                  "events:CreateEventBus",
                  "events:DeleteEventBus",
                  "events:PutRule",
                  "events:DeleteRule",
                  "events:PutTargets",
                  "events:RemoveTargets",
                  "events:DescribeRule",
                  "events:ListTargetsByRule",
                  "events:TagResource",
                  "events:UntagResource"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "sns:CreateTopic",
                  "sns:DeleteTopic",
                  "sns:GetTopicAttributes",
                  "sns:SetTopicAttributes",
                  "sns:Subscribe",
                  "sns:Unsubscribe",
                  "sns:ListSubscriptionsByTopic",
                  "sns:Publish",
                  "sns:TagResource",
                  "sns:UntagResource"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "sqs:CreateQueue",
                  "sqs:DeleteQueue",
                  "sqs:GetQueueAttributes",
                  "sqs:SetQueueAttributes",
                  "sqs:TagQueue",
                  "sqs:UntagQueue",
                  "sqs:ListQueueTags"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "rds:CreateDBInstance",
                  "rds:DeleteDBInstance",
                  "rds:ModifyDBInstance",
                  "rds:DescribeDBInstances",
                  "rds:CreateDBSubnetGroup",
                  "rds:DeleteDBSubnetGroup",
                  "rds:ModifyDBSubnetGroup",
                  "rds:DescribeDBSubnetGroups",
                  "rds:AddTagsToResource",
                  "rds:ListTagsForResource"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "s3:CreateBucket",
                  "s3:DeleteBucket",
                  "s3:GetBucketLocation",
                  "s3:GetBucketTagging",
                  "s3:PutBucketTagging",
                  "s3:GetEncryptionConfiguration",
                  "s3:PutEncryptionConfiguration",
                  "s3:GetPublicAccessBlock",
                  "s3:PutPublicAccessBlock",
                  "s3:GetBucketPublicAccessBlock",
                  "s3:ListBucket",
                  "s3:PutObject",
                  "s3:GetObject",
                  "s3:DeleteObject"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "ec2:DescribeImages",
                  "ec2:DescribeInstances",
                  "ec2:DescribeSubnets",
                  "ec2:DescribeSecurityGroups",
                  "ec2:DescribeVpcs",
                  "ec2:RunInstances",
                  "ec2:TerminateInstances",
                  "ec2:CreateTags",
                  "ec2:ModifyInstanceAttribute",
                  "ec2:StartInstances",
                  "ec2:StopInstances",
                  "ec2:CreateVpc",
                  "ec2:DeleteVpc",
                  "ec2:ModifyVpcAttribute",
                  "ec2:DescribeAvailabilityZones",
                  "ec2:CreateSubnet",
                  "ec2:DeleteSubnet",
                  "ec2:ModifySubnetAttribute",
                  "ec2:CreateRouteTable",
                  "ec2:DeleteRouteTable",
                  "ec2:DescribeRouteTables",
                  "ec2:CreateRoute",
                  "ec2:ReplaceRoute",
                  "ec2:DeleteRoute",
                  "ec2:AssociateRouteTable",
                  "ec2:DisassociateRouteTable",
                  "ec2:CreateInternetGateway",
                  "ec2:DeleteInternetGateway",
                  "ec2:AttachInternetGateway",
                  "ec2:DetachInternetGateway",
                  "ec2:DescribeInternetGateways",
                  "ec2:CreateSecurityGroup",
                  "ec2:DeleteSecurityGroup",
                  "ec2:DescribeSecurityGroups",
                  "ec2:AuthorizeSecurityGroupIngress",
                  "ec2:RevokeSecurityGroupIngress",
                  "ec2:AuthorizeSecurityGroupEgress",
                  "ec2:RevokeSecurityGroupEgress",
                  "ec2:CreateVpcEndpoint",
                  "ec2:DeleteVpcEndpoints",
                  "ec2:DescribeVpcEndpoints",
                  "ec2:ModifyVpcEndpoint"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "ssm:GetParameter",
                  "ssm:GetParameters",
                  "ssm:DescribeParameters",
                  "ssm:PutParameter",
                  "ssm:DeleteParameter",
                  "ssm:CreateAssociation",
                  "ssm:UpdateAssociation",
                  "ssm:DeleteAssociation",
                  "ssm:DescribeAssociation",
                  "ssm:AddTagsToResource",
                  "ssm:RemoveTagsFromResource",
                  "ssm:ListTagsForResource",
                  "ssm:GetServiceSetting",
                  "ssm:UpdateServiceSetting",
                  "ssm:ResetServiceSetting"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "logs:CreateLogGroup",
                  "logs:DeleteLogGroup",
                  "logs:CreateLogStream",
                  "logs:DeleteLogStream",
                  "logs:PutLogEvents",
                  "logs:DescribeLogGroups",
                  "logs:DescribeLogStreams",
                  "logs:PutRetentionPolicy",
                  "logs:DeleteRetentionPolicy",
                  "logs:TagResource",
                  "logs:UntagResource"
                ],
                "Resource": "*"
              },

              {
                "Effect": "Allow",
                "Action": [
                  "cloudwatch:PutMetricAlarm",
                  "cloudwatch:DeleteAlarms",
                  "cloudwatch:DescribeAlarms",
                  "cloudwatch:PutDashboard",
                  "cloudwatch:DeleteDashboards",
                  "cloudwatch:GetDashboard",
                  "cloudwatch:ListDashboards"
                ],
                "Resource": "*"
              }

            ]
          }
          EOF

          aws iam put-role-policy \
            --role-name CloudMart-GitHubActions-Role \
            --policy-name CloudMartGitHubActionsDeployment \
            --policy-document file://deployment-policy.json

      - name: Create Admin Token SSM Policy
        shell: bash
        run: |
          cat > auth-ssm-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "ssm:GetParameter",
                  "ssm:PutParameter"
                ],
                "Resource": "arn:aws:ssm:${AWS_REGION}:${ACCOUNT_ID}:parameter/cloudmart/${ENVIRONMENT}/auth/admin-token"
              }
            ]
          }
          EOF

          aws iam put-role-policy \
            --role-name CloudMart-GitHubActions-Role \
            --policy-name CloudMartAuthSSMAccess \
            --policy-document file://auth-ssm-policy.json

      - name: Bootstrap Complete
        run: |
          echo "GitHub Actions IAM bootstrap completed successfully."

  # ============================================================
  # NETWORK
  # ============================================================

  deploy-network:
    needs: bootstrap-iam
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug GitHub OIDC Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap-iam.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Network Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM
  # ============================================================
  # DATA
  # ============================================================

  deploy-data:
    name: Deploy Data Stack
    needs:
      - bootstrap-iam
      - deploy-network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap-iam.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Get Artifacts Bucket
      # --------------------------------------------------------

      - name: Get Artifacts Bucket
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> "$GITHUB_ENV"

          echo "Artifacts bucket:"
          echo "$ARTIFACTS_BUCKET"
      # --------------------------------------------------------
      # Package Database Init Lambda
      # --------------------------------------------------------

      - name: Package Data SAM Template
        run: |
          aws cloudformation package \
            --template-file cloudformation/data-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/data-stack-packaged.yaml \
            --region ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Validate packaged template
      # --------------------------------------------------------

      - name: Validate Packaged Data Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack-packaged.yaml

      # --------------------------------------------------------
      # Deploy packaged Data Stack
      # --------------------------------------------------------

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack-packaged.yaml \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
            Environment=${{ env.ENVIRONMENT }} \
            DBUsername="${{ secrets.DB_USERNAME }}" \
            DBPassword="${{ secrets.DB_PASSWORD }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}
  # --------------------------------------------------------
  # Run Database Initialization Lambda
  # --------------------------------------------------------

      - name: Initialize CloudMart Database
        run: |
          aws lambda invoke \
            --function-name CloudMart-DatabaseInit-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }} \
            database-init-response.json

          cat database-init-response.json
  # ============================================================
  # AUTH
  # ============================================================

  deploy-auth:
    name: Deploy Auth Stack
    needs:
      - bootstrap-iam
      - deploy-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap-iam.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Artifacts Bucket
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV

      - name: Package Auth Lambda
        run: |
          aws cloudformation package \
            --template-file cloudformation/auth-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/auth-stack-packaged.yaml \
            --region ${{ env.AWS_REGION }}
      - name: Validate Auth Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth-stack-packaged.yaml

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth-stack-packaged.yaml \
            --stack-name cloudmart-auth-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
             Environment=${{ env.ENVIRONMENT }} \
             AdminToken="${{ secrets.ADMIN_TOKEN }}" \
             DBUsername="${{ secrets.DB_USERNAME }}" \
             DBPassword="${{ secrets.DB_PASSWORD }}" \
             --capabilities CAPABILITY_NAMED_IAM \
             --region ${{ env.AWS_REGION }}
  # ============================================================
  # API / APPLICATION
  # ============================================================
  deploy-api:
    name: Deploy API and Application Stack
    needs:
      - bootstrap-iam
      - deploy-auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap-iam.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate API Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-stack.yaml

      - name: Get Artifacts Bucket
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV

      - name: Package API SAM Template
        run: |
          aws cloudformation package \
            --template-file cloudformation/api-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/api-stack-packaged.yaml \
            --region ${{ env.AWS_REGION }}

      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-stack-packaged.yaml \
            --stack-name cloudmart-api-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
            Environment=${{ env.ENVIRONMENT }} \
            DBUsername="${{ secrets.DB_USERNAME }}" \
            DBPassword="${{ secrets.DB_PASSWORD }}" \
            NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset

      - name: Show API Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-api-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs" \
            --output table
  # ============================================================
  # REPORTING / DASHBOARD
  # ============================================================

  deploy-reporting:
    name: Deploy Reporting and Dashboard Stack
    needs:
      - bootstrap-iam
      - deploy-api
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap-iam.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
      # --------------------------------------------------------
      # Get Artifacts Bucket
      # --------------------------------------------------------

      - name: Get Artifacts Bucket
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV

          echo "Artifacts bucket:"
          echo "$ARTIFACTS_BUCKET"
      # --------------------------------------------------------
      # Package Dashboard
      # --------------------------------------------------------

      - name: Package Dashboard
        run: |
          cd dashboard

          zip -r ../cloudmart-dashboard.zip .

          cd ..

          echo "Dashboard package created:"
          ls -lh cloudmart-dashboard.zip
      # --------------------------------------------------------
      # Upload Dashboard Package
      # --------------------------------------------------------

      - name: Upload Dashboard Package
        run: |
          aws s3 cp \
            cloudmart-dashboard.zip \
            "s3://${ARTIFACTS_BUCKET}/dashboard/cloudmart-dashboard.zip"

          echo "Dashboard package uploaded successfully."
      # --------------------------------------------------------
      # Validate Reporting Template
      # --------------------------------------------------------

      - name: Validate Reporting Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/reporting-stack.yaml \
            --region ${{ env.AWS_REGION }}
      # --------------------------------------------------------
      # Deploy Reporting Stack
      # --------------------------------------------------------

      - name: Deploy Reporting Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/reporting-stack.yaml \
            --stack-name cloudmart-reporting-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
            Environment=${{ env.ENVIRONMENT }} \
            DashboardVersion=${{ github.sha }} \
            DBUsername="${{ secrets.DB_USERNAME }}" \
            DBPassword="${{ secrets.DB_PASSWORD }}" \
            AdminToken="${{ secrets.ADMIN_TOKEN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset
      # --------------------------------------------------------
      # Show Dashboard URL
      # --------------------------------------------------------

      - name: Show Dashboard URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-reporting-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue" \
            --output text
      # --------------------------------------------------------
      # Validate Monitoring Template
      # --------------------------------------------------------

      - name: Validate Monitoring Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/monitoring-stack.yaml \
            --region ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Get Dashboard Instance ID
      # --------------------------------------------------------

      - name: Get Dashboard Instance ID
        run: |
          DASHBOARD_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-reporting-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardInstanceId'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "DashboardInstanceId=$DASHBOARD_INSTANCE_ID"
          echo "DASHBOARD_INSTANCE_ID=$DASHBOARD_INSTANCE_ID" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Recover Failed Monitoring Stack
      # --------------------------------------------------------

      - name: Recover Failed Monitoring Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-monitoring-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].StackStatus" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true)

          if [ "$STATUS" = "ROLLBACK_FAILED" ]; then
            echo "Monitoring stack is ROLLBACK_FAILED. Deleting it so CloudFormation can recreate it."

            aws cloudformation delete-stack \
              --stack-name cloudmart-monitoring-${{ env.ENVIRONMENT }} \
              --region ${{ env.AWS_REGION }}

            aws cloudformation wait stack-delete-complete \
              --stack-name cloudmart-monitoring-${{ env.ENVIRONMENT }} \
              --region ${{ env.AWS_REGION }}
          fi

      # --------------------------------------------------------
      # Deploy Monitoring Stack
      # --------------------------------------------------------

      - name: Deploy Monitoring Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/monitoring-stack.yaml \
            --stack-name cloudmart-monitoring-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              AlarmEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
              DashboardInstanceId=$DASHBOARD_INSTANCE_ID \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --no-fail-on-empty-changeset
      # --------------------------------------------------------
      # Show Monitoring Dashboard
      # --------------------------------------------------------

      - name: Show Monitoring Dashboard
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-monitoring-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='OperationsDashboardUrl'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }}
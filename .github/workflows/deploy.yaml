name: Deploy CloudMart Network

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  STACK_NAME: cloudmart-network-dev

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Get code from GitHub
      - name: Get Code
        uses: actions/checkout@v4

      # 2. Connect GitHub to AWS
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Check AWS connection
      - name: Check AWS
        run: aws sts get-caller-identity

      # 4. Check CloudFormation file
      - name: Validate Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml

      # 5. Deploy infrastructure
      - name: Deploy Network
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name $STACK_NAME \
            --parameter-overrides \
              Environment=dev \
              AvailabilityZone=ap-south-1a \
              VpcCidr=10.0.0.0/16 \
              PublicSubnetCidr=10.0.1.0/24 \
              PrivateSubnetCidr=10.0.2.0/24 \
              AdminCidr=${{ secrets.ADMIN_CIDR }}

      # 6. Check deployment result
      - name: Check Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].[StackName,StackStatus]' \
            --output table

      # 7. Show outputs
      - name: Show Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query 'Stacks[0].Outputs' \
            --output table
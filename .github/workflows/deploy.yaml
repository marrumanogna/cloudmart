name: CloudMart Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - 'product-lambda/**'
      - 'order-lambda/**'
      - 'order-processor-lambda/**'
      - 'database-init-lambda/**'
      - 'database/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  # ============================================================
  # NETWORK
  # ============================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Network Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM


  # ============================================================
  # DATA
  # ============================================================

  # ============================================================
  # DATA
  # ============================================================

  deploy-data:
    name: Deploy Data Stack
    needs: deploy-network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Get Artifacts Bucket
      # --------------------------------------------------------

      - name: Get Artifacts Bucket
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text 2>/dev/null || true)

          if [ -z "$ARTIFACTS_BUCKET" ] || [ "$ARTIFACTS_BUCKET" = "None" ]; then
            echo "Artifacts bucket does not exist yet."
            echo "The data stack creates the bucket, so packaging cannot use it before first deployment."
          else
            echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV
          fi

      # --------------------------------------------------------
      # First deployment / RDS + S3
      # --------------------------------------------------------

      - name: Check Data Stack
        id: check-data-stack
        run: |
          if aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Data Stack First Time
        if: steps.check-data-stack.outputs.exists == 'false'
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              DBUsername="${{ secrets.DB_USERNAME }}" \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Get bucket after first deployment
      # --------------------------------------------------------

      - name: Get Artifacts Bucket After Deployment
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV

          echo "Artifacts bucket:"
          echo "$ARTIFACTS_BUCKET"

      # --------------------------------------------------------
      # Package Database Init Lambda
      # --------------------------------------------------------

      - name: Package Data SAM Template
        run: |
          aws cloudformation package \
            --template-file cloudformation/data-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/data-stack-packaged.yaml \
            --region ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Validate packaged template
      # --------------------------------------------------------

      - name: Validate Packaged Data Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack-packaged.yaml

      # --------------------------------------------------------
      # Deploy packaged Data Stack
      # --------------------------------------------------------

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack-packaged.yaml \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              DBUsername="${{ secrets.DB_USERNAME }}" \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Store Database Parameters in SSM
      # --------------------------------------------------------

      - name: Store Database Parameters in SSM
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          RDS_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='RdsEndpoint'].OutputValue" \
            --output text)

          RDS_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='RdsPort'].OutputValue" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue" \
            --output text)

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/database/username" \
            --type "SecureString" \
            --value "$DB_USERNAME" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/database/password" \
            --type "SecureString" \
            --value "$DB_PASSWORD" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/host" \
            --type "String" \
            --value "$RDS_HOST" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/port" \
            --type "String" \
            --value "$RDS_PORT" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/db-name" \
            --type "String" \
            --value "$DB_NAME" \
            --overwrite

          echo "Database parameters stored in SSM."
  # --------------------------------------------------------
  # Run Database Initialization Lambda
  # --------------------------------------------------------

      - name: Initialize CloudMart Database
        run: |
          aws lambda invoke \
            --function-name CloudMart-DatabaseInit-${{ env.ENVIRONMENT }} \
            --region ${{ env.AWS_REGION }} \
            database-init-response.json

          cat database-init-response.json


  # ============================================================
  # AUTH
  # ============================================================

  deploy-auth:
    name: Deploy Auth Stack
    needs: deploy-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Customer Token If Missing
        run: |
          if aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/customer-token" \
            >/dev/null 2>&1; then
            echo "Customer token already exists in SSM"
          else
            CUSTOMER_TOKEN=$(openssl rand -hex 32)

            aws ssm put-parameter \
              --name "/cloudmart/${ENVIRONMENT}/auth/customer-token" \
              --type "SecureString" \
              --value "$CUSTOMER_TOKEN"

            echo "Customer token created and stored in SSM"
          fi
      - name: Verify Admin Token
        run: |
          aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/admin-token" \
            --with-decryption \
            --query "Parameter.Name" \
            --output text

          echo "Admin token exists in SSM"

      - name: Validate Auth Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth-stack.yaml

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth-stack.yaml \
            --stack-name cloudmart-auth-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              CustomerTokenParameterName="/cloudmart/${{ env.ENVIRONMENT }}/auth/customer-token" \
              AdminTokenParameterName="/cloudmart/${{ env.ENVIRONMENT }}/auth/admin-token" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

  # ============================================================
  # API / APPLICATION
  # ============================================================

  deploy-api:
    name: Deploy API and Application Stack
    needs: deploy-auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate API Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/api-stack.yaml

      - name: Get Artifacts Bucket
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" \
            --output text)

          echo "ARTIFACTS_BUCKET=$ARTIFACTS_BUCKET" >> $GITHUB_ENV

      - name: Package API SAM Template
        run: |
          aws cloudformation package \
            --template-file cloudformation/api-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file cloudformation/api-stack-packaged.yaml \
            --region ${{ env.AWS_REGION }}

      - name: Deploy API Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/api-stack-packaged.yaml \
            --stack-name cloudmart-api-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              LowStockEmail="marrumanogna@gmail.com" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }}

      - name: Show API Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-api-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs" \
            --output table

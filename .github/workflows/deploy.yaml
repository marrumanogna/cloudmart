name: CloudMart Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'cloudformation/**'
      - '.github/workflows/deploy.yaml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: dev

jobs:

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Network Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_NAMED_IAM


  deploy-data:
    name: Deploy Data Stack
    needs: deploy-network
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Data Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              DBUsername="${{ secrets.DB_USERNAME }}" \
              DBPassword="${{ secrets.DB_PASSWORD }}" \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Store Database Parameters in SSM
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          RDS_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='RdsEndpoint'].OutputValue" \
            --output text)

          RDS_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='RdsPort'].OutputValue" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${{ env.ENVIRONMENT }} \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue" \
            --output text)

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/host" \
            --type "String" \
            --value "$RDS_HOST" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/port" \
            --type "String" \
            --value "$RDS_PORT" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/db-name" \
            --type "String" \
            --value "$DB_NAME" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/username" \
            --type "SecureString" \
            --value "$DB_USERNAME" \
            --overwrite

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/rds/password" \
            --type "SecureString" \
            --value "$DB_PASSWORD" \
            --overwrite


  deploy-auth:
    name: Deploy Auth Stack
    needs: deploy-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Auth Token Secret
        run: |
          if [ -z "${{ secrets.CLOUDMART_AUTH_TOKEN }}" ]; then
            echo "ERROR: CLOUDMART_AUTH_TOKEN secret is missing"
            exit 1
          fi

      - name: Store Auth Token in SSM
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/api-token" \
            --type "SecureString" \
            --value "$AUTH_TOKEN" \
            --overwrite

      - name: Validate Auth Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/auth-stack.yaml

      - name: Deploy Auth Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/auth-stack.yaml \
            --stack-name cloudmart-auth-${{ env.ENVIRONMENT }} \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              AuthTokenParameterName="/cloudmart/${{ env.ENVIRONMENT }}/auth/api-token" \
            --capabilities CAPABILITY_NAMED_IAM
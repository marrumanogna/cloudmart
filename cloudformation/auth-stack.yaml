AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  CustomerTokenParameterName:
    Type: String
    Description: SSM parameter containing the customer API token
    Default: /cloudmart/dev/auth/customer-token

  AdminTokenParameterName:
    Type: String
    Description: SSM parameter containing the admin API token
    Default: /cloudmart/dev/auth/admin-token

Resources:


  AuthorizerRole:

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-authorizer-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/customer-token
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/admin-token
        - PolicyName: AuthorizerRdsSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
        - PolicyName: AuthorizerLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'
        - PolicyName: AuthorizerCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - arn:aws:logs:ap-south-1:230623977534:log-group:/aws/lambda/cloudmart-authorizer-${Environment}:*

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-authorizer-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt AuthorizerRole.Arn
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          CUSTOMER_TOKEN_PARAMETER: !Ref CustomerTokenParameterName
          ADMIN_TOKEN_PARAMETER: !Ref AdminTokenParameterName
          DB_HOST: !Sub /cloudmart/${Environment}/rds/host
          DB_PORT: !Sub /cloudmart/${Environment}/rds/port
          DB_NAME: !Sub /cloudmart/${Environment}/rds/db-name
          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/rds/password

      Code:
        ZipFile: |
          import boto3
          import os
          import pymysql

          ssm = boto3.client("ssm")

          CUSTOMER_TOKEN_PARAMETER = os.environ["CUSTOMER_TOKEN_PARAMETER"]
          ADMIN_TOKEN_PARAMETER = os.environ["ADMIN_TOKEN_PARAMETER"]

          DB_HOST = os.environ["DB_HOST"]
          DB_PORT = os.environ["DB_PORT"]
          DB_NAME = os.environ["DB_NAME"]
          DB_USERNAME_PARAMETER = os.environ["DB_USERNAME_PARAMETER"]
          DB_PASSWORD_PARAMETER = os.environ["DB_PASSWORD_PARAMETER"]


          def get_parameter(parameter_name):
              response = ssm.get_parameter(
                  Name=parameter_name,
                  WithDecryption=True
              )
              return response["Parameter"]["Value"]


          def generate_policy(principal_id, effect, resource, role=None, customer_id=None):
              response = {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }

              context = {}

              if role:
                  context["role"] = role

              if customer_id:
                  context["customer_id"] = str(customer_id)

              if context:
                  response["context"] = context

              return response


          def get_customer_by_token(token):
              username = get_parameter(DB_USERNAME_PARAMETER)
              password = get_parameter(DB_PASSWORD_PARAMETER)

              connection = pymysql.connect(
                  host=DB_HOST,
                  port=int(DB_PORT),
                  user=username,
                  password=password,
                  database=DB_NAME,
                  connect_timeout=5,
                  cursorclass=pymysql.cursors.DictCursor
              )

              try:
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT customer_id
                          FROM customers
                          WHERE customer_token = %s
                          """,
                          (token,)
                      )
                      return cursor.fetchone()
              finally:
                  connection.close()


          def lambda_handler(event, context):
              method_arn = event.get("methodArn", "*")

              arn_parts = method_arn.split("/")

              if len(arn_parts) >= 2:
                  policy_resource = f"{arn_parts[0]}/{arn_parts[1]}/*"
              else:
                  policy_resource = method_arn

              provided_token = event.get("authorizationToken", "")

              if not provided_token:
                  headers = event.get("headers") or {}
                  provided_token = headers.get("authorization", "")

              if not provided_token:
                  headers = event.get("headers") or {}
                  provided_token = headers.get("Authorization", "")

              if provided_token.lower().startswith("bearer "):
                  provided_token = provided_token[7:].strip()

              if not provided_token:
                  raise Exception("Unauthorized")

              try:
                  admin_token = get_parameter(ADMIN_TOKEN_PARAMETER)

                  if provided_token == admin_token:
                      print("Admin authenticated")
                      return generate_policy(
                          "cloudmart-admin",
                          "Allow",
                          policy_resource,
                          "ADMIN"
                      )

                  customer = get_customer_by_token(provided_token)

                  if customer:
                      print(f"Customer authenticated: {customer['customer_id']}")
                      return generate_policy(
                          f"cloudmart-customer-{customer['customer_id']}",
                          "Allow",
                          policy_resource,
                          "CUSTOMER",
                          customer["customer_id"]
                      )

              except Exception as error:
                  print(f"Authorization error: {error}")
                  return generate_policy(
                      "cloudmart-unauthorized",
                      "Deny",
                      method_arn
                  )

              print("Authorization failed")
              raise Exception("Unauthorized")

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com

Outputs:

  AuthorizerFunctionArn:
    Description: CloudMart Lambda Authorizer ARN
    Value: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionArn

  AuthorizerFunctionInvokeArn:
    Description: API Gateway Lambda Authorizer invocation URI
    Value: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn

  CustomerTokenParameterName:
    Description: SSM parameter containing the CloudMart customer token
    Value: !Ref CustomerTokenParameterName
    Export:
      Name: !Sub CloudMart-${Environment}-CustomerTokenParameterName

  AdminTokenParameterName:
    Description: SSM parameter containing the CloudMart admin token
    Value: !Ref AdminTokenParameterName
    Export:
      Name: !Sub CloudMart-${Environment}-AdminTokenParameterName

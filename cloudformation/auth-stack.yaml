AWSTemplateFormatVersion: '2010-09-09'
Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthTokenParameterName:
    Type: String
    Description: Name of the SecureString SSM parameter containing the API token
    Default: /cloudmart/dev/auth/api-token

Resources:

  # ============================================================
  # SSM PARAMETERS
  # ============================================================

  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/auth/api-token
      Type: SecureString
      Value: CHANGE_ME
      Description: CloudMart API authentication token

  RDSHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/host
      Type: String
      Value: CHANGE_ME
      Description: RDS database address

  RDSPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/port
      Type: String
      Value: '3306'
      Description: RDS database port

  RDSDBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/db-name
      Type: String
      Value: CHANGE_ME
      Description: RDS database schema name

  RDSUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/username
      Type: SecureString
      Value: CHANGE_ME
      Description: RDS database username

  RDSPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/password
      Type: SecureString
      Value: CHANGE_ME
      Description: RDS database password

  LowStockThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/inventory/low-stock-threshold
      Type: String
      Value: '10'
      Description: Defines when low-stock alert should trigger

  OrderNotificationsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/sns/order-notifications-topic-arn
      Type: String
      Value: CHANGE_ME
      Description: Order notification SNS topic ARN


  # ============================================================
  # EXISTING AUTH STACK - UNCHANGED
  # ============================================================

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-authorizer-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/api-token

        - PolicyName: AuthorizerCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-authorizer-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt AuthorizerRole.Arn
      Timeout: 10
      MemorySize: 128

      Environment:
        Variables:
          AUTH_TOKEN_PARAMETER: !Ref AuthTokenParameterName

      Code:
        ZipFile: |
          import boto3
          import os

          ssm = boto3.client("ssm")

          PARAMETER_NAME = os.environ["AUTH_TOKEN_PARAMETER"]


          def get_auth_token():
              response = ssm.get_parameter(
                  Name=PARAMETER_NAME,
                  WithDecryption=True
              )
              return response["Parameter"]["Value"]


          def generate_policy(principal_id, effect, resource):
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource
                          }
                      ]
                  }
              }


          def lambda_handler(event, context):

              method_arn = event.get("methodArn", "*")

              provided_token = event.get("authorizationToken", "")

              if not provided_token:
                  headers = event.get("headers") or {}
                  provided_token = headers.get("authorization", "")

              if provided_token.lower().startswith("bearer "):
                  provided_token = provided_token[7:].strip()

              try:
                  expected_token = get_auth_token()
              except Exception as error:
                  print(f"Failed to retrieve authentication token: {error}")
                  return generate_policy(
                      "cloudmart-unauthorized",
                      "Deny",
                      method_arn
                  )

              if provided_token and provided_token == expected_token:
                  return generate_policy(
                      "cloudmart-user",
                      "Allow",
                      method_arn
                  )

              return generate_policy(
                  "cloudmart-unauthorized",
                  "Deny",
                  method_arn
              )

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com


Outputs:

  AuthorizerFunctionArn:
    Description: CloudMart Lambda Authorizer ARN
    Value: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionArn

  AuthorizerFunctionInvokeArn:
    Description: API Gateway Lambda Authorizer invocation URI
    Value: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn

  AuthTokenParameterName:
    Description: SSM SecureString parameter containing the CloudMart API token
    Value: !Ref AuthTokenParameterName
    Export:
      Name: !Sub CloudMart-${Environment}-AuthTokenParameterName
AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Authentication token used by the Lambda Authorizer

Resources:

  # ------------------------------------------------------------
  # SSM Parameter - Authentication Token
  # ------------------------------------------------------------

  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/auth/api-token
      Type: SecureString
      Value: !Ref AuthToken
      Description: CloudMart API authentication token
      Tags:
        Environment: !Ref Environment
        Application: CloudMart


  # ------------------------------------------------------------
  # Lambda Authorizer IAM Role
  # ------------------------------------------------------------

  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-Authorizer-Role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerSSMAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/api-token

        - PolicyName: AuthorizerCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cloudmart-authorizer-${Environment}:*

  # ------------------------------------------------------------
  # Lambda Authorizer
  # ------------------------------------------------------------

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-authorizer-${Environment}

      Runtime: python3.12
      Handler: index.lambda_handler

      Role: !GetAtt AuthorizerRole.Arn

      Timeout: 10
      MemorySize: 128

      Environment:
        Variables:
          AUTH_TOKEN_PARAMETER:
            !Ref AuthTokenParameter

      Code:
        ZipFile: |
          import boto3
          import os

          ssm = boto3.client("ssm")

          def lambda_handler(event, context):

              try:
                  token_parameter = os.environ["AUTH_TOKEN_PARAMETER"]

                  response = ssm.get_parameter(
                      Name=token_parameter,
                      WithDecryption=True
                  )

                  expected_token = response["Parameter"]["Value"]

                  headers = event.get("headers") or {}

                  provided_token = (
                      headers.get("Authorization")
                      or headers.get("authorization")
                  )

                  if not provided_token:
                      return {
                          "principalId": "anonymous",
                          "policyDocument": {
                              "Version": "2012-10-17",
                              "Statement": [
                                  {
                                      "Action": "execute-api:Invoke",
                                      "Effect": "Deny",
                                      "Resource": event.get(
                                          "methodArn",
                                          "*"
                                      )
                                  }
                              ]
                          }
                      }

                  if provided_token.startswith("Bearer "):
                      provided_token = provided_token[7:]

                  if provided_token != expected_token:
                      return {
                          "principalId": "unauthorized",
                          "policyDocument": {
                              "Version": "2012-10-17",
                              "Statement": [
                                  {
                                      "Action": "execute-api:Invoke",
                                      "Effect": "Deny",
                                      "Resource": event.get(
                                          "methodArn",
                                          "*"
                                      )
                                  }
                              ]
                          }
                      }

                  return {
                      "principalId": "cloudmart-user",
                      "policyDocument": {
                          "Version": "2012-10-17",
                          "Statement": [
                              {
                                  "Action": "execute-api:Invoke",
                                  "Effect": "Allow",
                                  "Resource": event.get(
                                      "methodArn",
                                      "*"
                                  )
                              }
                          ]
                      }
                  }

              except Exception as error:
                  print(f"Authorizer error: {error}")

                  return {
                      "principalId": "error",
                      "policyDocument": {
                          "Version": "2012-10-17",
                          "Statement": [
                              {
                                  "Action": "execute-api:Invoke",
                                  "Effect": "Deny",
                                  "Resource": event.get(
                                      "methodArn",
                                      "*"
                                  )
                              }
                          ]
                      }
                  }

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CloudMart

  # ------------------------------------------------------------
  # Lambda Permission for API Gateway
  # ------------------------------------------------------------

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthorizerFunction
      Principal: apigateway.amazonaws.com


# --------------------------------------------------------------
# Outputs
# --------------------------------------------------------------

Outputs:

  AuthorizerFunctionArn:
    Description: CloudMart Lambda Authorizer ARN
    Value: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionArn

  AuthorizerFunctionInvokeArn:
    Description: CloudMart Lambda Authorizer Invoke ARN
    Value: !Sub
      - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
      - AuthorizerArn: !GetAtt AuthorizerFunction.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerFunctionInvokeArn

  AuthTokenParameterName:
    Description: SSM parameter containing the CloudMart API token
    Value: !Ref AuthTokenParameter
    Export:
      Name: !Sub CloudMart-${Environment}-AuthTokenParameterName
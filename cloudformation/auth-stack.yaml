AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Authentication, SSM Parameters, and Application IAM Roles

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: CloudMart environment

  DBUsername:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: CloudMart RDS username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: CloudMart RDS password

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: CloudMart API authentication token

  LowStockThreshold:
    Type: String
    Default: '10'
    Description: Inventory quantity that triggers low-stock alert


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # 1. SSM PARAMETER STORE
  # ==========================================================

  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/auth/api-token
      Type: SecureString
      Value: !Ref AuthToken
      Description: CloudMart API authentication token
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Authentication


  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/host
      Type: String
      Value:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-RdsEndpoint
      Description: CloudMart RDS endpoint
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Database


  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/port
      Type: String
      Value:
        Fn::ImportValue:
          !Sub CloudMart-${Environment}-RdsPort
      Description: CloudMart RDS MySQL port
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Database


  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/db-name
      Type: String
      Value: cloudmart
      Description: CloudMart database name
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Database


  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/username
      Type: SecureString
      Value: !Ref DBUsername
      Description: CloudMart RDS username
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Database


  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/password
      Type: SecureString
      Value: !Ref DBPassword
      Description: CloudMart RDS password
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Database


  LowStockThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/inventory/low-stock-threshold
      Type: String
      Value: !Ref LowStockThreshold
      Description: CloudMart low-stock threshold
      Tags:
        Environment: !Ref Environment
        Application: CloudMart
        Purpose: Inventory


  # ==========================================================
  # 2. LAMBDA AUTHORIZER IAM ROLE
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-LambdaAuthorizer-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: LambdaAuthorizerReadAuthToken
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/api-token

        - PolicyName: LambdaAuthorizerCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-Authorizer-${Environment}:*

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CloudMart


  # ==========================================================
  # 3. PRODUCT LAMBDA IAM ROLE
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-ProductLambda-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ProductLambdaReadSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/inventory/*

        - PolicyName: ProductLambdaEventBridge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'

        - PolicyName: ProductLambdaSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'

        - PolicyName: ProductLambdaCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: ProductLambdaCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*

        - PolicyName: ProductLambdaVPCAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                Resource: '*'

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CloudMart


  # ==========================================================
  # 4. ORDER LAMBDA IAM ROLE
  # ==========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-OrderLambda-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: OrderLambdaReadSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/eventbridge/*

        - PolicyName: OrderLambdaInvokeProcessor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'

        - PolicyName: OrderLambdaEventBridge
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: '*'

        - PolicyName: OrderLambdaSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'

        - PolicyName: OrderLambdaCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: OrderLambdaCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*

        - PolicyName: OrderLambdaVPCAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                Resource: '*'

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CloudMart


  # ==========================================================
  # 5. REPORT LAMBDA IAM ROLE
  # ==========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-ReportLambda-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ReportLambdaReadSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: ReportLambdaS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: '*'

        - PolicyName: ReportLambdaCloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: ReportLambdaCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*

        - PolicyName: ReportLambdaVPCAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                Resource: '*'

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CloudMart


  # ==========================================================
  # 6. EC2 DASHBOARD IAM ROLE
  # ==========================================================

  EC2DashboardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub CloudMart-EC2Dashboard-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: EC2DashboardS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: '*'

        - PolicyName: EC2DashboardSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: EC2DashboardCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/cloudmart/dashboard/*

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CloudMart


  # ==========================================================
  # 7. LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub CloudMart-Authorizer-${Environment}

      Runtime: python3.12

      Handler: index.lambda_handler

      Role: !GetAtt LambdaAuthorizerRole.Arn

      Timeout: 10

      MemorySize: 128

      Environment:
        Variables:
          AUTH_TOKEN_PARAMETER: !Sub /cloudmart/${Environment}/auth/api-token

      Code:
        ZipFile: |
          import os
          import boto3

          ssm = boto3.client("ssm")

          TOKEN_PARAMETER = os.environ["AUTH_TOKEN_PARAMETER"]

          def get_auth_token():
              response = ssm.get_parameter(
                  Name=TOKEN_PARAMETER,
                  WithDecryption=True
              )
              return response["Parameter"]["Value"]

          def lambda_handler(event, context):

              try:
                  expected_token = get_auth_token()

                  headers = event.get("headers") or {}

                  authorization = (
                      headers.get("Authorization")
                      or headers.get("authorization")
                  )

                  if not authorization:
                      return {
                          "isAuthorized": False
                      }

                  if authorization.startswith("Bearer "):
                      token = authorization[7:].strip()
                  else:
                      token = authorization.strip()

                  if token == expected_token:
                      return {
                          "isAuthorized": True
                      }

                  return {
                      "isAuthorized": False
                  }

              except Exception as error:
                  print(f"Authorization error: {error}")

                  return {
                      "isAuthorized": False
                  }


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  LambdaAuthorizerArn:
    Description: CloudMart Lambda Authorizer Function ARN
    Value: !GetAtt LambdaAuthorizer.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerArn


  LambdaAuthorizerInvokeArn:
    Description: CloudMart Lambda Authorizer API Gateway Invoke ARN
    Value: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizer.Arn}/invocations
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerInvokeArn


  LambdaAuthorizerRoleArn:
    Description: CloudMart Lambda Authorizer IAM Role ARN
    Value: !GetAtt LambdaAuthorizerRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerRoleArn


  ProductLambdaRoleArn:
    Description: CloudMart Product Lambda IAM Role ARN
    Value: !GetAtt ProductLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  OrderLambdaRoleArn:
    Description: CloudMart Order Lambda IAM Role ARN
    Value: !GetAtt OrderLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaRoleArn


  ReportLambdaRoleArn:
    Description: CloudMart Report Lambda IAM Role ARN
    Value: !GetAtt ReportLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ReportLambdaRoleArn


  EC2DashboardRoleArn:
    Description: CloudMart EC2 Dashboard IAM Role ARN
    Value: !GetAtt EC2DashboardRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-EC2DashboardRoleArn


  AuthTokenParameterName:
    Description: API authentication token SSM parameter
    Value: !Sub /cloudmart/${Environment}/auth/api-token
    Export:
      Name: !Sub CloudMart-${Environment}-AuthTokenParameter


  DBHostParameterName:
    Description: RDS host SSM parameter
    Value: !Sub /cloudmart/${Environment}/rds/host
    Export:
      Name: !Sub CloudMart-${Environment}-DBHostParameter


  DBPortParameterName:
    Description: RDS port SSM parameter
    Value: !Sub /cloudmart/${Environment}/rds/port
    Export:
      Name: !Sub CloudMart-${Environment}-DBPortParameter


  DBNameParameterName:
    Description: RDS database name SSM parameter
    Value: !Sub /cloudmart/${Environment}/rds/db-name
    Export:
      Name: !Sub CloudMart-${Environment}-DBNameParameter


  DBUsernameParameterName:
    Description: RDS username SSM parameter
    Value: !Sub /cloudmart/${Environment}/rds/username
    Export:
      Name: !Sub CloudMart-${Environment}-DBUsernameParameter


  DBPasswordParameterName:
    Description: RDS password SSM parameter
    Value: !Sub /cloudmart/${Environment}/rds/password
    Export:
      Name: !Sub CloudMart-${Environment}-DBPasswordParameter


  LowStockThresholdParameterName:
    Description: Low-stock threshold SSM parameter
    Value: !Sub /cloudmart/${Environment}/inventory/low-stock-threshold
    Export:
      Name: !Sub CloudMart-${Environment}-LowStockThresholdParameter
AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Monitoring, CloudWatch Dashboard, Alarms and SNS Notifications

Parameters:

  Environment:
    Type: String
    Default: dev

  AlarmEmail:
    Type: String
    Description: SSM parameter containing the alarm notification email

  DashboardInstanceId:
    Type: String
    Description: CloudMart Dashboard EC2 instance ID

Resources:

  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-monitoring-alerts-${Environment}

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  OrdersFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-OrdersFailed
      AlarmDescription: Orders failed during order processing
      Namespace: CloudMart/Operations
      MetricName: OrdersFailed
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  LowStockEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-LowStockEvents
      AlarmDescription: Low stock event detected
      Namespace: CloudMart/Operations
      MetricName: LowStockEvents
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
  OrdersPlacedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-OrdersPlaced
      AlarmDescription: Alarm when an order is successfully placed
      Namespace: CloudMart/Operations
      MetricName: OrdersPlaced
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  DashboardCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-Dashboard-HighCPU
      AlarmDescription: Dashboard EC2 CPU utilization is high
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: InstanceId
          Value: !Ref DashboardInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  DashboardStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudMart-${Environment}-Dashboard-StatusCheck
      AlarmDescription: Dashboard EC2 instance status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_Instance
      Dimensions:
        - Name: InstanceId
          Value: !Ref DashboardInstanceId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  CloudMartOperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: cloudmart-operations

      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
               "properties": {
                 "markdown": "# CloudMart Operations\nEnvironment: ${Environment}\n\nMonitoring: API Gateway, Lambda, SQS, RDS, EC2 and business metrics"
               }
             },

            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway - Total Requests",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "cloudmart-api-${Environment}", "Stage", "${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 2,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway - 4XX Errors",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "AWS/ApiGateway", "4XXError", "ApiName", "cloudmart-api-${Environment}", "Stage", "${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway - 5XX Errors",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "AWS/ApiGateway", "5XXError", "ApiName", "cloudmart-api-${Environment}", "Stage", "${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 8,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "cloudmart-authorizer-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-product-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-customer-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-order-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-order-processor-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-report-${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "cloudmart-authorizer-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-product-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-customer-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-order-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-order-processor-${Environment}" ],
                  [ ".", ".", ".", "cloudmart-report-${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 14,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "cloudmart-product-${Environment}", { "stat": "p50" } ],
                  [ ".", ".", ".", "cloudmart-product-${Environment}", { "stat": "p90" } ],
                  [ ".", ".", ".", "cloudmart-order-${Environment}", { "stat": "p50" } ],
                  [ ".", ".", ".", "cloudmart-order-${Environment}", { "stat": "p90" } ],
                  [ ".", ".", ".", "cloudmart-order-processor-${Environment}", { "stat": "p50" } ],
                  [ ".", ".", ".", "cloudmart-order-processor-${Environment}", { "stat": "p90" } ],
                  [ ".", ".", ".", "cloudmart-report-${Environment}", { "stat": "p50" } ],
                  [ ".", ".", ".", "cloudmart-report-${Environment}", { "stat": "p90" } ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 20,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Failed Orders Queue Depth",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "cloudmart-failed-orders-${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 20,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS CPU Utilization",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "cloudmart-mysql-${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 26,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS Database Connections",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [ "AWS/RDS", "DatabaseConnections", "DBInstanceIdentifier", "cloudmart-mysql-${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 26,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS Free Storage Space",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "cloudmart-mysql-${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 32,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Placed",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "CloudMart/Operations", "OrdersPlaced", "Environment", "${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 32,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Orders Failed",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "CloudMart/Operations", "OrdersFailed", "Environment", "${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 38,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Low Stock Events",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ "CloudMart/Operations", "LowStockEvents", "Environment", "${Environment}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 12,
              "y": 38,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 CPU Utilization",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [ "AWS/EC2", "CPUUtilization", "InstanceId", "${DashboardInstanceId}" ]
                ]
              }
            },

            {
              "type": "metric",
              "x": 0,
              "y": 44,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Status Check",
                "view": "timeSeries",
                "region": "ap-south-1",
                "period": 300,
                "stat": "Maximum",
                "metrics": [
                  [ "AWS/EC2", "StatusCheckFailed_Instance", "InstanceId", "${DashboardInstanceId}" ]
                ]
              }
            }
          ]
        }

Outputs:

  OperationsDashboardName:
    Description: CloudWatch operations dashboard
    Value: cloudmart-operations

  OperationsDashboardUrl:
    Description: CloudWatch dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=cloudmart-operations

  AlarmTopicArn:
    Description: SNS topic for monitoring alarms
    Value: !Ref AlarmNotificationTopic

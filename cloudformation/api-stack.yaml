AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31


Description: CloudMart API and Application Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  LowStockEmail:
    Type: String
    Default: ""
    Description: Email address for low-stock SNS alerts. Leave empty to skip subscription.

Conditions:

  CreateLowStockSubscription: !Not
    - !Equals
      - !Ref LowStockEmail
      - ""

Resources:

  FailedOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cloudmart-failed-orders-${Environment}
  # ============================================================
  # PRODUCT LAMBDA ROLE
  # ============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-product-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ProductLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: ProductLambdaEventsAndSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt CloudMartEventBus.Arn

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref LowStockTopic

        - PolicyName: ProductLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: ProductLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'


  # ============================================================
  # ORDER LAMBDA ROLE
  # ============================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-order-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: OrderLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: OrderLambdaInvokeProcessor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt OrderProcessorLambda.Arn

        - PolicyName: OrderLambdaEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt CloudMartEventBus.Arn

        - PolicyName: OrderLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: OrderLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'


  # ============================================================
  # ORDER PROCESSOR ROLE
  # ============================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-order-processor-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: OrderProcessorSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: OrderProcessorCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: OrderProcessorVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'

        - PolicyName: OrderProcessorSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt FailedOrdersQueue.Arn

        - PolicyName: OrderProcessorEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt CloudMartEventBus.Arn

  # ============================================================
  # REPORT LAMBDA ROLE
  # ============================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-report-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ReportLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: ReportLambdaS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:s3:::${Bucket}/*
                    - Bucket:
                        Fn::ImportValue: !Sub CloudMart-${Environment}-ReportsBucketName

        - PolicyName: ReportLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: ReportLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'


  # ============================================================
  # EVENTBRIDGE
  # ============================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus


  # ============================================================
  # SNS LOW STOCK ALERT
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-low-stock-${Environment}


  LowStockSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateLowStockSubscription
    Properties:
      Protocol: email
      Endpoint: !Ref LowStockEmail
      TopicArn: !Ref LowStockTopic


  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-product-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt ProductLambdaRole.Arn
      Timeout: 15
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsEndpoint

          DB_PORT:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsPort

          DB_NAME:
            Fn::ImportValue: !Sub CloudMart-${Environment}-DBName

          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/rds/password

          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_TOPIC_ARN: !Ref LowStockTopic

      CodeUri: ../product-lambda/package/

  # ============================================================
  # ORDER LAMBDA
  # ============================================================

  OrderLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-order-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt OrderLambdaRole.Arn
      Timeout: 15
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ORDER_PROCESSOR_FUNCTION: !Ref OrderProcessorLambda
          EVENT_BUS_NAME: !Ref CloudMartEventBus


      CodeUri: ../order-lambda/package/

  # ============================================================
  # ORDER PROCESSOR LAMBDA
  # ============================================================

  OrderProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-order-processor-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt OrderProcessorLambdaRole.Arn
      Timeout: 30
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsEndpoint

          DB_PORT:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsPort

          DB_NAME:
            Fn::ImportValue: !Sub CloudMart-${Environment}-DBName

          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/rds/password

          FAILED_ORDERS_QUEUE_URL: !Ref FailedOrdersQueue
          EVENT_BUS_NAME: !Ref CloudMartEventBus

      CodeUri: ../order-processor-lambda/package/

  # ============================================================
  # REPORT LAMBDA
  # ============================================================

  ReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-report-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt ReportLambdaRole.Arn
      Timeout: 30
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          REPORTS_BUCKET:
            Fn::ImportValue: !Sub CloudMart-${Environment}-ReportsBucketName

      Code:
        ZipFile: |
          import json
          import os

          def lambda_handler(event, context):

              print(json.dumps({
                  "message": "Report Lambda invoked",
                  "environment": os.environ["ENVIRONMENT"],
                  "request_id": context.aws_request_id
              }))

              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Report service is deployed"
                  })
              }


  # ============================================================
  # API GATEWAY
  # ============================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub cloudmart-api-${Environment}
      Description: CloudMart REST API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # API AUTHORIZER
  # ============================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub cloudmart-authorizer-${Environment}
      RestApiId: !Ref CloudMartApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300

      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue: !Sub CloudMart-${Environment}-AuthorizerFunctionArn


  # ============================================================
  # /products
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products


  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  ProductsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # /products/{id}
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # /orders
  # ============================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: orders


  OrdersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt OrderLambda.Arn


  # ============================================================
  # LAMBDA PERMISSIONS
  # ============================================================

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductLambda
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  OrderLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderLambda
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  CloudMartApiDeployment:
    Type: AWS::ApiGateway::Deployment

    DependsOn:
      - ProductsGetMethod
      - ProductsPostMethod
      - ProductIdGetMethod
      - ProductIdPutMethod
      - ProductIdDeleteMethod
      - OrdersPostMethod

    Properties:
      RestApiId: !Ref CloudMartApi
      Description: !Sub CloudMart API deployment for ${Environment}


  CloudMartApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref CloudMartApiDeployment
      StageName: !Ref Environment
      Description: !Sub CloudMart ${Environment} API stage


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ApiId:
    Description: CloudMart API Gateway ID
    Value: !Ref CloudMartApi
    Export:
      Name: !Sub CloudMart-${Environment}-ApiId


  ApiInvokeUrl:
    Description: CloudMart API invoke URL
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaArn


  OrderLambdaArn:
    Description: Order Lambda ARN
    Value: !GetAtt OrderLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaArn


  OrderProcessorLambdaArn:
    Description: Order Processor Lambda ARN
    Value: !GetAtt OrderProcessorLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderProcessorLambdaArn


  ReportLambdaArn:
    Description: Report Lambda ARN
    Value: !GetAtt ReportLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ReportLambdaArn


  ProductLambdaRoleArn:
    Description: Product Lambda IAM role ARN
    Value: !GetAtt ProductLambdaRole.Arn


  OrderLambdaRoleArn:
    Description: Order Lambda IAM role ARN
    Value: !GetAtt OrderLambdaRole.Arn


  OrderProcessorLambdaRoleArn:
    Description: Order Processor Lambda IAM role ARN
    Value: !GetAtt OrderProcessorLambdaRole.Arn


  ReportLambdaRoleArn:
    Description: Report Lambda IAM role ARN
    Value: !GetAtt ReportLambdaRole.Arn


  EventBusName:
    Description: CloudMart EventBridge bus
    Value: !Ref CloudMartEventBus


  LowStockTopicArn:
    Description: CloudMart low-stock SNS topic
    Value: !Ref LowStockTopic

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CloudMart API and Application Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  LowStockEmail:
    Type: String
    Default: ""
    Description: Email address for low-stock SNS alerts. Leave empty to skip subscription.

Conditions:

  CreateLowStockSubscription: !Not
    - !Equals
      - !Ref LowStockEmail
      - ""

Resources:

  FailedOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cloudmart-failed-orders-${Environment}
  # ============================================================
  # CUSTOMER LAMBDA ROLE
  # ============================================================

  CustomerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-customer-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CustomerLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: CustomerLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

        - PolicyName: CustomerLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'
  # ============================================================
  # PRODUCT LAMBDA ROLE
  # ============================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-product-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ProductLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: ProductLambdaEventsAndSNS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt CloudMartEventBus.Arn

              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref LowStockTopic

        - PolicyName: ProductLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: ProductLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'


  # ============================================================
  # ORDER LAMBDA ROLE
  # ============================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-order-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: OrderLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: OrderLambdaInvokeProcessor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt OrderProcessorLambda.Arn

        - PolicyName: OrderLambdaEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt CloudMartEventBus.Arn

        - PolicyName: OrderLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: OrderLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'


  # ============================================================
  # ORDER PROCESSOR ROLE
  # ============================================================

  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-order-processor-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: OrderProcessorSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: OrderProcessorCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: OrderProcessorVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'

        - PolicyName: OrderProcessorSQS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt FailedOrdersQueue.Arn

        - PolicyName: OrderProcessorEvents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !GetAtt CloudMartEventBus.Arn


  # ============================================================
  # REPORT LAMBDA ROLE
  # ============================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-report-lambda-role-${Environment}

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: ReportLambdaSSM
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*

        - PolicyName: ReportLambdaS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub
                    - arn:${AWS::Partition}:s3:::${Bucket}/*
                    - Bucket:
                        Fn::ImportValue: !Sub CloudMart-${Environment}-ReportsBucketName

        - PolicyName: ReportLambdaCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: ReportLambdaVpcAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                Resource: '*'


  # ============================================================
  # EVENTBRIDGE
  # ============================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus


  # ============================================================
  # SNS LOW STOCK ALERT
  # ============================================================

  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-low-stock-${Environment}


  # ============================================================
  # M4 ORDER CONFIRMATION SNS
  # ============================================================

  OrderConfirmedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-order-confirmed-${Environment}


  # M3 INVENTORY CHANGE EVENTBRIDGE RULE
  # ============================================================
  
  InventoryChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-inventory-change-${Environment}
      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
          - cloudmart.product
        detail-type:
          - Inventory Change

      Targets:
        - Arn: !Ref LowStockTopic
          Id: LowStockSNSTarget

          InputTransformer:
            InputPathsMap:
              product_id: "$.detail.product_id"
              product_name: "$.detail.product_name"
              stock_quantity: "$.detail.stock_quantity"

            InputTemplate: '"CloudMart Low Stock Alert!\n\nProduct ID: <product_id>\nProduct: <product_name>\nRemaining Stock: <stock_quantity>\n\nPlease restock this product."'


  LowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !GetAtt LowStockTopic.TopicArn

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !GetAtt LowStockTopic.TopicArn

            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt InventoryChangeRule.Arn

  # ============================================================
  # M4 ORDER PLACED SNS
  # ============================================================

  OrderPlacedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-order-placed-${Environment}


  OrderPlacedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-order-placed-${Environment}
      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderPlaced

      Targets:
        - Arn: !Ref OrderPlacedTopic
          Id: OrderPlacedSNSTarget

          InputTransformer:
            InputPathsMap:
              order_id: "$.detail.order_id"
              customer_id: "$.detail.customer_id"

            InputTemplate: '"Order Placed!\n\nHello,\n\nYour CloudMart order has been successfully placed.\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nStatus: PLACED\n\nWe are processing your order and will keep you updated.\n\nThank you for shopping with CloudMart!"'


  OrderPlacedTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !GetAtt OrderPlacedTopic.TopicArn
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !GetAtt OrderPlacedTopic.TopicArn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderPlacedRule.Arn

  # ============================================================
  # M4 ORDER CONFIRMED EVENTBRIDGE RULE
  # ============================================================

  OrderConfirmedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-order-confirmed-${Environment}
      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderConfirmed

      Targets:
        - Arn: !Ref OrderConfirmedTopic
          Id: OrderConfirmedSNSTarget

          InputTransformer:
            InputPathsMap:
              order_id: "$.detail.order_id"
              customer_id: "$.detail.customer_id"
              total_amount: "$.detail.total_amount"
              status: "$.detail.status"

            InputTemplate: '"Order Confirmed!\n\nHello,\n\nYour CloudMart order has been successfully confirmed.\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nTotal Amount: ₹<total_amount>\nStatus: <status>\n\nThank you for shopping with CloudMart!"'


  OrderConfirmedTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderConfirmedTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !Ref OrderConfirmedTopic

            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderConfirmedRule.Arn

  # ============================================================
  # M4 ORDER FAILED SNS + EVENTBRIDGE
  # ============================================================

  OrderFailedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudmart-order-failed-${Environment}


  OrderFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub cloudmart-order-failed-${Environment}
      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderFailed

      Targets:
        - Arn: !Ref OrderFailedTopic
          Id: OrderFailedSNSTarget
          InputTransformer:
            InputPathsMap:
              order_id: "$.detail.order_id"
              customer_id: "$.detail.customer_id"
              reason: "$.detail.reason"

            InputTemplate: '"Order Failed!\n\nHello,\n\nUnfortunately, we were unable to process your CloudMart order.\n\nOrder ID: <order_id>\nCustomer ID: <customer_id>\nReason: <reason>\n\nPlease try again or choose another product.\n\nThank you,\nCloudMart Team"'

  OrderFailedTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !GetAtt OrderFailedTopic.TopicArn

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sns:Publish
            Resource: !GetAtt OrderFailedTopic.TopicArn

            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderFailedRule.Arn

   # ============================================================
  # CUSTOMER LAMBDA
  # ============================================================

  CustomerLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-customer-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt CustomerLambdaRole.Arn
      Timeout: 15
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id

        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsEndpoint

          DB_PORT:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsPort

          DB_NAME:
            Fn::ImportValue: !Sub CloudMart-${Environment}-DBName

          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/rds/password

      CodeUri: ../customer-lambda/package/
  # ============================================================
  # PRODUCT LAMBDA
  # ============================================================

  ProductLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-product-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt ProductLambdaRole.Arn
      Timeout: 15
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id

        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsEndpoint

          DB_PORT:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsPort

          DB_NAME:
            Fn::ImportValue: !Sub CloudMart-${Environment}-DBName

          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/rds/password

          EVENT_BUS_NAME: !Ref CloudMartEventBus
          LOW_STOCK_TOPIC_ARN: !Ref LowStockTopic

      CodeUri: ../product-lambda/package/


  # ============================================================
  # ORDER LAMBDA
  # ============================================================

  OrderLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-order-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt OrderLambdaRole.Arn
      Timeout: 60
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id

        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ORDER_PROCESSOR_FUNCTION: !Ref OrderProcessorLambda
          EVENT_BUS_NAME: !Ref CloudMartEventBus

      CodeUri: ../order-lambda/package/


  # ============================================================
  # ORDER PROCESSOR LAMBDA
  # ============================================================

  OrderProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudmart-order-processor-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt OrderProcessorLambdaRole.Arn
      Timeout: 30
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id

        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          DB_HOST:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsEndpoint

          DB_PORT:
            Fn::ImportValue: !Sub CloudMart-${Environment}-RdsPort

          DB_NAME:
            Fn::ImportValue: !Sub CloudMart-${Environment}-DBName

          DB_USERNAME_PARAMETER: !Sub /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/rds/password

          FAILED_ORDERS_QUEUE_URL: !Ref FailedOrdersQueue
          EVENT_BUS_NAME: !Ref CloudMartEventBus

      CodeUri: ../order-processor-lambda/package/


  # ============================================================
  # REPORT LAMBDA
  # ============================================================

  ReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub cloudmart-report-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt ReportLambdaRole.Arn
      Timeout: 30
      MemorySize: 256

      VpcConfig:
        SubnetIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnetId
          - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id

        SecurityGroupIds:
          - Fn::ImportValue: !Sub CloudMart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment

          REPORTS_BUCKET:
            Fn::ImportValue: !Sub CloudMart-${Environment}-ReportsBucketName

      Code:
        ZipFile: |
          import json
          import os

          def lambda_handler(event, context):

              print(json.dumps({
                  "message": "Report Lambda invoked",
                  "environment": os.environ["ENVIRONMENT"],
                  "request_id": context.aws_request_id
              }))

              return {
                  "statusCode": 200,
                  "body": json.dumps({
                      "message": "Report service is deployed"
                  })
              }


  # ============================================================
  # API GATEWAY
  # ============================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub cloudmart-api-${Environment}
      Description: CloudMart REST API

      EndpointConfiguration:
        Types:
          - REGIONAL


  # ============================================================
  # API AUTHORIZER
  # ============================================================

  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub cloudmart-authorizer-${Environment}
      RestApiId: !Ref CloudMartApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300

      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
          - AuthorizerArn:
              Fn::ImportValue: !Sub CloudMart-${Environment}-AuthorizerFunctionArn


  # ============================================================
  # /products
  # ============================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products


  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  ProductsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # /products/{id}
  # ============================================================

  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"


  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt ProductLambda.Arn


  # ============================================================
  # /orders
  # ============================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: orders
  OrdersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt OrderLambda.Arn

  OrderIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref OrdersResource
      PathPart: "{order_id}"

  OrderIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.order_id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt OrderLambda.Arn

  OrderIdPatchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      RequestParameters:
        method.request.path.order_id: true

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt OrderLambda.Arn

  OrdersPostMethod:
    Type: AWS::ApiGateway::Method
  OrdersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt OrderLambda.Arn

  # ============================================================
  # /customers
  # ============================================================

  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: customers


  CustomersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref CustomersResource
      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST

        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
            - FunctionArn: !GetAtt CustomerLambda.Arn
  # ============================================================
  # LAMBDA PERMISSIONS
  # ============================================================

  CustomerLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CustomerLambda
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*

  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductLambda
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  OrderLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderLambda
      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*


  # ============================================================
  # API DEPLOYMENT
  # ============================================================

  CloudMartApiDeployment:
     Type: AWS::ApiGateway::Deployment

     DependsOn:
      - ProductsGetMethod
      - ProductsPostMethod
      - ProductIdGetMethod
      - ProductIdPutMethod
      - ProductIdDeleteMethod
      - OrdersGetMethod
      - OrderIdGetMethod
      - OrderIdPatchMethod
      - OrdersPostMethod
      - CustomersPostMethod

     Properties:
      RestApiId: !Ref CloudMartApi
      Description: !Sub CloudMart API deployment for ${Environment} v2


  CloudMartApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartApi
      DeploymentId: !Ref CloudMartApiDeployment
      StageName: !Ref Environment
      Description: !Sub CloudMart ${Environment} API stage


# ================================================================
# OUTPUTS
# ================================================================

Outputs:

  ApiId:
    Description: CloudMart API Gateway ID
    Value: !Ref CloudMartApi
    Export:
      Name: !Sub CloudMart-${Environment}-ApiId


  ApiInvokeUrl:
    Description: CloudMart API invoke URL
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}


  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaArn


  OrderLambdaArn:
    Description: Order Lambda ARN
    Value: !GetAtt OrderLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaArn


  OrderProcessorLambdaArn:
    Description: Order Processor Lambda ARN
    Value: !GetAtt OrderProcessorLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderProcessorLambdaArn


  ReportLambdaArn:
    Description: Report Lambda ARN
    Value: !GetAtt ReportLambda.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ReportLambdaArn


  ProductLambdaRoleArn:
    Description: Product Lambda IAM role ARN
    Value: !GetAtt ProductLambdaRole.Arn


  OrderLambdaRoleArn:
    Description: Order Lambda IAM role ARN
    Value: !GetAtt OrderLambdaRole.Arn


  OrderProcessorLambdaRoleArn:
    Description: Order Processor Lambda IAM role ARN
    Value: !GetAtt OrderProcessorLambdaRole.Arn


  ReportLambdaRoleArn:
    Description: Report Lambda IAM role ARN
    Value: !GetAtt ReportLambdaRole.Arn


  EventBusName:
    Description: CloudMart EventBridge bus
    Value: !Ref CloudMartEventBus


  LowStockTopicArn:
    Description: CloudMart low-stock SNS topic
    Value: !Ref LowStockTopic





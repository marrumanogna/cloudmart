AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudMart API and Application Stack
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
  LowStockEmail:
    Type: String
    Default: ''
    Description: Email address for low-stock SNS alerts. Leave empty to skip 
      subscription.
Conditions:
  CreateLowStockSubscription:
    Fn::Not:
    - Fn::Equals:
      - Ref: LowStockEmail
      - ''
Resources:
  FailedOrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: cloudmart-failed-orders-${Environment}
  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: cloudmart-product-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: ProductLambdaSSM
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource:
            - Fn::Sub: 
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
      - PolicyName: ProductLambdaEventsAndSNS
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource:
            - Fn::GetAtt:
              - CloudMartEventBus
              - Arn
          - Effect: Allow
            Action:
            - sns:Publish
            Resource:
            - Ref: LowStockTopic
      - PolicyName: ProductLambdaCloudWatch
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - cloudwatch:PutMetricData
            Resource: '*'
      - PolicyName: ProductLambdaVpcAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSubnets
            - ec2:DeleteNetworkInterface
            Resource: '*'
  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: cloudmart-order-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: OrderLambdaSSM
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource:
            - Fn::Sub: 
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
      - PolicyName: OrderLambdaInvokeProcessor
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - Fn::GetAtt:
              - OrderProcessorLambda
              - Arn
      - PolicyName: OrderLambdaEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource:
            - Fn::GetAtt:
              - CloudMartEventBus
              - Arn
      - PolicyName: OrderLambdaCloudWatch
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - cloudwatch:PutMetricData
            Resource: '*'
      - PolicyName: OrderLambdaVpcAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSubnets
            - ec2:DeleteNetworkInterface
            Resource: '*'
  OrderProcessorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: cloudmart-order-processor-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: OrderProcessorSSM
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource:
            - Fn::Sub: 
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
      - PolicyName: OrderProcessorCloudWatch
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - cloudwatch:PutMetricData
            Resource: '*'
      - PolicyName: OrderProcessorVpcAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSubnets
            - ec2:DeleteNetworkInterface
            Resource: '*'
      - PolicyName: OrderProcessorSQS
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:SendMessage
            Resource:
              Fn::GetAtt:
              - FailedOrdersQueue
              - Arn
      - PolicyName: OrderProcessorEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource:
            - Fn::GetAtt:
              - CloudMartEventBus
              - Arn
  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: cloudmart-report-lambda-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: ReportLambdaSSM
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource:
            - Fn::Sub: 
                arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/rds/*
      - PolicyName: ReportLambdaS3
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            Resource:
            - Fn::Sub:
              - arn:${AWS::Partition}:s3:::${Bucket}/*
              - Bucket:
                  Fn::ImportValue:
                    Fn::Sub: CloudMart-${Environment}-ReportsBucketName
      - PolicyName: ReportLambdaCloudWatch
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - cloudwatch:PutMetricData
            Resource: '*'
      - PolicyName: ReportLambdaVpcAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSubnets
            - ec2:DeleteNetworkInterface
            Resource: '*'
  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name:
        Fn::Sub: cloudmart-${Environment}-event-bus
  LowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: cloudmart-low-stock-${Environment}
  LowStockSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateLowStockSubscription
    Properties:
      Protocol: email
      Endpoint:
        Ref: LowStockEmail
      TopicArn:
        Ref: LowStockTopic
  OrderConfirmedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: cloudmart-order-confirmed-${Environment}
  OrderConfirmedSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint:
        Ref: LowStockEmail
      TopicArn:
        Ref: OrderConfirmedTopic
  OrderConfirmedRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: cloudmart-order-confirmed-${Environment}
      EventBusName:
        Ref: CloudMartEventBus
      EventPattern:
        source:
        - cloudmart.order
        detail-type:
        - OrderConfirmed
      Targets:
      - Arn:
          Ref: OrderConfirmedTopic
        Id: OrderConfirmedSNSTarget
  OrderConfirmedTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
      - Ref: OrderConfirmedTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action:
          - sns:Publish
          Resource:
            Ref: OrderConfirmedTopic
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - OrderConfirmedRule
                - Arn
  ProductLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cloudmart-product-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - ProductLambdaRole
        - Arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetId
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          DB_HOST:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-RdsEndpoint
          DB_PORT:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-RdsPort
          DB_NAME:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DBName
          DB_USERNAME_PARAMETER:
            Fn::Sub: /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER:
            Fn::Sub: /cloudmart/${Environment}/rds/password
          EVENT_BUS_NAME:
            Ref: CloudMartEventBus
          LOW_STOCK_TOPIC_ARN:
            Ref: LowStockTopic
      CodeUri: 
        s3://cloudmart-data-dev-artifactsbucket-sa0b9hgkhvza/5c45969009195bb924398bc94bb7b8b5
  OrderLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cloudmart-order-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - OrderLambdaRole
        - Arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetId
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          ORDER_PROCESSOR_FUNCTION:
            Ref: OrderProcessorLambda
          EVENT_BUS_NAME:
            Ref: CloudMartEventBus
      CodeUri: 
        s3://cloudmart-data-dev-artifactsbucket-sa0b9hgkhvza/454269d4e63e766707873b4404dea19b
  OrderProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: cloudmart-order-processor-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - OrderProcessorLambdaRole
        - Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetId
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          DB_HOST:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-RdsEndpoint
          DB_PORT:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-RdsPort
          DB_NAME:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-DBName
          DB_USERNAME_PARAMETER:
            Fn::Sub: /cloudmart/${Environment}/rds/username
          DB_PASSWORD_PARAMETER:
            Fn::Sub: /cloudmart/${Environment}/rds/password
          FAILED_ORDERS_QUEUE_URL:
            Ref: FailedOrdersQueue
          EVENT_BUS_NAME:
            Ref: CloudMartEventBus
      CodeUri: 
        s3://cloudmart-data-dev-artifactsbucket-sa0b9hgkhvza/3a2967b2fc659a33c36cad8079456af2
  ReportLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: cloudmart-report-${Environment}
      Runtime: python3.11
      Handler: index.lambda_handler
      Role:
        Fn::GetAtt:
        - ReportLambdaRole
        - Arn
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnetId
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          ENVIRONMENT:
            Ref: Environment
          REPORTS_BUCKET:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-ReportsBucketName
      Code:
        ZipFile: "import json\nimport os\n\ndef lambda_handler(event, context):\n\n\
          \    print(json.dumps({\n        \"message\": \"Report Lambda invoked\"\
          ,\n        \"environment\": os.environ[\"ENVIRONMENT\"],\n        \"request_id\"\
          : context.aws_request_id\n    }))\n\n    return {\n        \"statusCode\"\
          : 200,\n        \"body\": json.dumps({\n            \"message\": \"Report\
          \ service is deployed\"\n        })\n    }\n"
  CloudMartApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        Fn::Sub: cloudmart-api-${Environment}
      Description: CloudMart REST API
      EndpointConfiguration:
        Types:
        - REGIONAL
  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name:
        Fn::Sub: cloudmart-authorizer-${Environment}
      RestApiId:
        Ref: CloudMartApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300
      AuthorizerUri:
        Fn::Sub:
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn:
            Fn::ImportValue:
              Fn::Sub: CloudMart-${Environment}-AuthorizerFunctionArn
  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ParentId:
        Fn::GetAtt:
        - CloudMartApi
        - RootResourceId
      PathPart: products
  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ResourceId:
        Ref: ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId:
        Ref: CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn:
              Fn::GetAtt:
              - ProductLambda
              - Arn
  ProductsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ResourceId:
        Ref: ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId:
        Ref: CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn:
              Fn::GetAtt:
              - ProductLambda
              - Arn
  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ParentId:
        Ref: ProductsResource
      PathPart: '{id}'
  ProductIdGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ResourceId:
        Ref: ProductIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId:
        Ref: CloudMartAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn:
              Fn::GetAtt:
              - ProductLambda
              - Arn
  ProductIdPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ResourceId:
        Ref: ProductIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId:
        Ref: CloudMartAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn:
              Fn::GetAtt:
              - ProductLambda
              - Arn
  ProductIdDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ResourceId:
        Ref: ProductIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId:
        Ref: CloudMartAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn:
              Fn::GetAtt:
              - ProductLambda
              - Arn
  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ParentId:
        Fn::GetAtt:
        - CloudMartApi
        - RootResourceId
      PathPart: orders
  OrdersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: CloudMartApi
      ResourceId:
        Ref: OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId:
        Ref: CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn:
              Fn::GetAtt:
              - OrderLambda
              - Arn
  ProductLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ProductLambda
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: 
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*
  OrderLambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: OrderLambda
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: 
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*
  CloudMartApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - ProductsGetMethod
    - ProductsPostMethod
    - ProductIdGetMethod
    - ProductIdPutMethod
    - ProductIdDeleteMethod
    - OrdersPostMethod
    Properties:
      RestApiId:
        Ref: CloudMartApi
      Description:
        Fn::Sub: CloudMart API deployment for ${Environment}
  CloudMartApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId:
        Ref: CloudMartApi
      DeploymentId:
        Ref: CloudMartApiDeployment
      StageName:
        Ref: Environment
      Description:
        Fn::Sub: CloudMart ${Environment} API stage
Outputs:
  ApiId:
    Description: CloudMart API Gateway ID
    Value:
      Ref: CloudMartApi
    Export:
      Name:
        Fn::Sub: CloudMart-${Environment}-ApiId
  ApiInvokeUrl:
    Description: CloudMart API invoke URL
    Value:
      Fn::Sub: 
        https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ProductLambdaArn:
    Description: Product Lambda ARN
    Value:
      Fn::GetAtt:
      - ProductLambda
      - Arn
    Export:
      Name:
        Fn::Sub: CloudMart-${Environment}-ProductLambdaArn
  OrderLambdaArn:
    Description: Order Lambda ARN
    Value:
      Fn::GetAtt:
      - OrderLambda
      - Arn
    Export:
      Name:
        Fn::Sub: CloudMart-${Environment}-OrderLambdaArn
  OrderProcessorLambdaArn:
    Description: Order Processor Lambda ARN
    Value:
      Fn::GetAtt:
      - OrderProcessorLambda
      - Arn
    Export:
      Name:
        Fn::Sub: CloudMart-${Environment}-OrderProcessorLambdaArn
  ReportLambdaArn:
    Description: Report Lambda ARN
    Value:
      Fn::GetAtt:
      - ReportLambda
      - Arn
    Export:
      Name:
        Fn::Sub: CloudMart-${Environment}-ReportLambdaArn
  ProductLambdaRoleArn:
    Description: Product Lambda IAM role ARN
    Value:
      Fn::GetAtt:
      - ProductLambdaRole
      - Arn
  OrderLambdaRoleArn:
    Description: Order Lambda IAM role ARN
    Value:
      Fn::GetAtt:
      - OrderLambdaRole
      - Arn
  OrderProcessorLambdaRoleArn:
    Description: Order Processor Lambda IAM role ARN
    Value:
      Fn::GetAtt:
      - OrderProcessorLambdaRole
      - Arn
  ReportLambdaRoleArn:
    Description: Report Lambda IAM role ARN
    Value:
      Fn::GetAtt:
      - ReportLambdaRole
      - Arn
  EventBusName:
    Description: CloudMart EventBridge bus
    Value:
      Ref: CloudMartEventBus
  LowStockTopicArn:
    Description: CloudMart low-stock SNS topic
    Value:
      Ref: LowStockTopic

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CloudMart Data Stack

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  DBName:
    Type: String
    Default: cloudmart

  DBUsername:
    Type: String
    NoEcho: true

  DBPassword:
    Type: String
    NoEcho: true

  NotificationEmail:
    Type: String

Resources:

  # ============================================================
  # RDS SUBNET GROUP
  # ============================================================

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CloudMart RDS subnet group

      SubnetIds:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnetId

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet2Id

      Tags:
        - Key: Name
          Value: !Sub cloudmart-rds-subnet-group-${Environment}


  # ============================================================
  # RDS MYSQL
  # ============================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub cloudmart-mysql-${Environment}

      Engine: mysql

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername

      MasterUserPassword: !Ref DBPassword

      DBInstanceClass: db.t3.micro

      AllocatedStorage: 20

      StorageType: gp3

      Port: 3306

      PubliclyAccessible: false

      MultiAZ: false

      DBSubnetGroupName: !Ref RdsSubnetGroup

      VPCSecurityGroups:
        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RdsSecurityGroupId

      BackupRetentionPeriod: 1

      DeletionProtection: false

      DeleteAutomatedBackups: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-rds-${Environment}
  # ============================================================
  # RDS SSM PARAMETERS
  # ============================================================

  RdsHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/host
      Type: String
      Value: !GetAtt CloudMartRDS.Endpoint.Address

      Description: CloudMart RDS endpoint


  RdsPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/port
      Type: String
      Value: !GetAtt CloudMartRDS.Endpoint.Port

      Description: CloudMart RDS port


  RdsDbNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/rds/db-name
      Type: String
      Value: !Ref DBName

      Description: CloudMart database name
  

  # ============================================================
  # REPORTS S3 BUCKET
  # ============================================================

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudmart-reports-${Environment}-${AWS::AccountId}

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      Tags:
        - Key: Name
          Value: !Sub cloudmart-reports-${Environment}


  # ============================================================
  # DATABASE INIT LAMBDA IAM ROLE
  # ============================================================

  DatabaseInitLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub CloudMart-DatabaseInitLambda-${Environment}

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:
              # ------------------------------------------------
              # CLOUDWATCH LOGS
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/CloudMart-DatabaseInit-${Environment}:*
              # ------------------------------------------------
              # VPC NETWORK INTERFACES
              # ------------------------------------------------

              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface

                Resource: "*"


  # ============================================================
  # DATABASE INIT LAMBDA
  # ============================================================

  DatabaseInitLambda:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub CloudMart-DatabaseInit-${Environment}

      Runtime: python3.13

      Handler: index.lambda_handler

      Role: !GetAtt DatabaseInitLambdaRole.Arn

      Timeout: 300

      MemorySize: 256

      CodeUri: ../database-init-lambda/

      VpcConfig:

        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              !Sub CloudMart-${Environment}-PrivateSubnetId

      Environment:

        Variables:

          DB_HOST:
            !GetAtt CloudMartRDS.Endpoint.Address

          DB_NAME:
            !Ref DBName

          DB_USERNAME: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword

  DatabaseInitLambdaInvokePolicy:
  
    Type: AWS::IAM::Policy

    Properties:
      PolicyName: !Sub CloudMart-DatabaseInitLambdaInvoke-${Environment}
      Roles:
        - CloudMart-GitHubActions-Role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:CloudMart-DatabaseInit-${Environment}

  # ============================================================
  # DATABASE INIT LAMBDA LOG GROUP
  # ============================================================

  DatabaseInitLambdaLogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub /aws/lambda/CloudMart-DatabaseInit-${Environment}

      RetentionInDays: 14


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  RdsEndpoint:
    Value:
      !GetAtt CloudMartRDS.Endpoint.Address
    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsEndpoint


  RdsPort:
    Value:
      !GetAtt CloudMartRDS.Endpoint.Port
    Export:
      Name:
        !Sub CloudMart-${Environment}-RdsPort


  ReportsBucketName:
    Value:
      !Ref ReportsBucket
    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportsBucketName


  DBName:
    Value:
      !Ref DBName
    Export:
      Name:
        !Sub CloudMart-${Environment}-DBName


  DBUsername:
    Value:
      !Ref DBUsername
    Export:
      Name:
        !Sub CloudMart-${Environment}-DBUsername


  DatabaseInitLambdaArn:
    Value:
      !GetAtt DatabaseInitLambda.Arn
    Export:
      Name:
        !Sub CloudMart-${Environment}-DatabaseInitLambdaArn